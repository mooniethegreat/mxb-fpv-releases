; MXB FPV preview. Press F9 in game for live controls and settings.
[Controls]
; Windows virtual-key code. 119 = F8. Controller button is optional.
ToggleKey=119
; auto prefers XInput; directinput supports USB FPV radios and other joysticks.
Backend=directinput
DeviceGuid=auto
XInputIndex=0
; -1 disables the controller toggle. DirectInput: zero-based button index.
; XInput: bit index (Start=4, Back=5, left stick=6, right stick=7, A=12).
ToggleButton=-1
; XInput axes: 0 right X, 1 right Y, 2 left X, 3 left Y, 4 LT, 5 RT.
; DirectInput axes: 0 X, 1 Y, 2 Z, 3 Rx, 4 Ry, 5 Rz, 6 slider 1, 7 slider 2.
RollAxis=0
PitchAxis=1
YawAxis=3
ThrottleAxis=2
InvertRoll=0
InvertPitch=0
InvertYaw=0
InvertThrottle=0
Deadzone=0.05

[Flight]
Preset=0
Fov=100
RcRate=0.8
SuperRate=0.7
Expo=0
Mode3D=0
ThrottleMid=0.5
ThrottleExpo=0
ThrottleLimit=1
Neutral3D=0.05
VehicleCollisions=1

[Rates]
; Models: 0 Betaflight, 1 Raceflight, 2 KISS, 3 Actual, 4 Quick.
Individual=1
Model=0
QuickRcExpo=0
RollRate=0.8
RollSuper=0.7
RollExpo=0
PitchRate=0.8
PitchSuper=0.7
PitchExpo=0
YawRate=0.8
YawSuper=0.7
YawExpo=0

[Audio]
Enabled=1
Remote=1
Volume=0.7
RemoteVolume=1
Range=180

[OSD]
Controls=1
Dashboard=1
ReplaceBikeHud=1

[Visuals]
Goggles=1
Controller=1
ControllerPose=1
RemoteDrones=1
ControllerDown=0.48
ControllerForward=0.30
GogglesForward=0.10

[Multiplayer]
; 0 = automatic sync through the current MX Bikes server; 1 = manual UDP fallback.
; All viewers need 0.6; neither server modifications nor an extra relay are needed.
Transport=0
Automatic=1
; The remaining fields are used only by the manual UDP fallback.
Enabled=0
HostRelay=0
Address=127.0.0.1
Port=48127
Room=mx-fpv

[Updates]
; Background GitHub check at startup, cached for 6 hours. No automatic installs.
Automatic=1
; 0.6 is a multiplayer tester release. Disable this for stable releases only.
TesterReleases=1
